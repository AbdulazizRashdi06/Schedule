<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Classy Sync</title>
    <style>
      :root {
        --navy: #0b1957;
        --cream: #f8f3eb;
        --paper: #fffdf8;
        --muted: #4f5a86;
        --alert: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 320px;
        padding: 18px;
        background: var(--cream);
        color: var(--navy);
        font: 600 14px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0;
        border-top: 1.5px solid rgb(11 25 87 / 0.12);
      }
      .dot {
        flex: none;
        width: 10px;
        height: 10px;
        margin-top: 5px;
        border-radius: 50%;
        background: rgb(11 25 87 / 0.2);
      }
      .dot.on {
        background: var(--navy);
      }
      .dot.bad {
        background: var(--alert);
      }
      .muted {
        color: var(--muted);
        font-weight: 500;
      }
      .bad-text {
        color: var(--alert);
      }
      button {
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: var(--navy);
        color: var(--cream);
        font: 800 14px system-ui, sans-serif;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--navy);
        box-shadow: inset 0 0 0 2px var(--navy);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 12px;
      }
      .bar {
        height: 8px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 99px;
        background: rgb(11 25 87 / 0.12);
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--navy);
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-top: 12px;
        font-weight: 600;
      }
      a {
        color: var(--navy);
      }
    </style>
  </head>
  <body>
    <h1>Classy Sync</h1>
    <div class="row"><span class="dot" id="classy-dot"></span><div id="classy"></div></div>
    <div class="row"><span class="dot" id="eduwave-dot"></span><div id="eduwave"></div></div>
    <div class="row"><span class="dot" id="run-dot"></span><div id="run" style="flex: 1"></div></div>
    <div class="actions">
      <button id="connect" class="secondary">Connect to Classy</button>
      <button id="sync">Sync now</button>
      <button id="stop" class="secondary" hidden>Stop</button>
    </div>
    <label><input type="checkbox" id="auto" /> Sync every morning at 06:30</label>
    <p id="error" class="bad-text" role="alert"></p>
    <script src="popup.js"></script>
  </body>
</html>
