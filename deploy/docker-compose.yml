# Runs next to the Zarqa stack and joins its Docker network, so Zarqa's Caddy can reach it as uni-schedule:8080.
# Usage on the server (from /opt/uni-schedule):
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: uni-schedule

services:
  uni-schedule:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uni-schedule:latest
    restart: unless-stopped
    environment:
      # "log" writes sign-in codes to `docker compose logs`; "resend" emails them.
      Email__Provider: ${EMAIL_PROVIDER:-log}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM:-}
      # true shows the code in the app (never for owners) while real email isn't set up.
      Auth__TestMode: ${AUTH_TEST_MODE:-false}
      # Comma-separated student IDs that are always owners, e.g. 22-0001,23-0042.
      Owners__Ids: ${OWNER_IDS:-}
      # The rest default to the server's own defaults; set them in deploy/.env to change them.
      # Per IP per 5 minutes: sign-in code requests, code checks, public timetable reads.
      RateLimits__RequestCode: ${RATE_LIMIT_REQUEST_CODE:-1000}
      RateLimits__Verify: ${RATE_LIMIT_VERIFY:-2000}
      RateLimits__PublicTimetable: ${RATE_LIMIT_PUBLIC_TIMETABLE:-600}
      # Wrong sign-in codes per IP per rolling hour, across all IDs.
      RateLimits__WrongCodesPerHour: ${RATE_LIMIT_WRONG_CODES_PER_HOUR:-300}
      # Extra EduWave course codes for Classy Sync, comma-separated. Set it empty for none.
      Sync__ExtraCodes: ${SYNC_EXTRA_CODES-CS1102-L}
      # The owners' dashboard setting wins over Planner__Enabled.
      Planner__Enabled: ${PLANNER_ENABLED:-false}
      Planner__AiUrl: ${PLANNER_AI_URL:-http://codex:8090/v1/chat/completions}
      Planner__AiModel: ${PLANNER_AI_MODEL:-gpt-6-luna}
      Analytics__Enabled: ${ANALYTICS_ENABLED:-true}
      Push__Subject: ${PUSH_SUBJECT:-mailto:schedule@tryzarqa.com}
    volumes:
      - data:/app/data
    networks:
      zarqa:
        aliases:
          - uni-schedule

networks:
  zarqa:
    external: true
    # Check with `docker network ls` on the server.
    name: ${ZARQA_NETWORK:-zarqa_default}

volumes:
  data:
