<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup — Done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 200ms ease}
.btn:active{transform:scale(0.97)}
.rise{opacity:0;animation:rise 560ms cubic-bezier(0.23,1,0.32,1) forwards}
.d1{animation-delay:120ms}.d2{animation-delay:200ms}.d3{animation-delay:280ms}.d4{animation-delay:360ms}.d5{animation-delay:900ms}.d6{animation-delay:1000ms}
.badge{animation:badge 620ms cubic-bezier(0.34,1.4,0.64,1) both}
.check{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 460ms 260ms cubic-bezier(0.23,1,0.32,1) forwards}
.ring{animation:ring 900ms 200ms cubic-bezier(0.23,1,0.32,1) both}
.cell{opacity:0;animation:cell 360ms cubic-bezier(0.23,1,0.32,1) forwards}
.chip{opacity:0;animation:rise 420ms cubic-bezier(0.23,1,0.32,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes badge{from{opacity:0;transform:scale(0.8) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{opacity:0.9;transform:scale(0.9)}to{opacity:0;transform:scale(1.6)}}
@keyframes cell{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.rise,.badge,.cell,.chip{animation:fade 200ms ease forwards}.ring{animation:none;opacity:0}.check{animation:none;stroke-dashoffset:0}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="padding: 56px 24px 0 24px; display: flex; flex-direction: column; gap: 14px">
    <h1 class="rise d1" style="margin: 0; font-size: 72px; line-height: 0.84; font-weight: 800; letter-spacing: -0.06em">You’re set.</h1>
    <p class="rise d2" style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">Here’s your semester. You can change sections or courses any time from the menu.</p>
  </div>

  <section class="rise d3" aria-label="Your semester" style="margin: 22px 12px 16px 12px; background: #0B1957; color: #F8F3EA; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 44px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: #9ECCFA">6 courses</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #D1E8FF">AI · YEAR 3</span>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{courses}}" as="c" hint-placeholder-count="6">
        <li class="chip" style="{{c.rowStyle}}">
          <span style="{{c.codeStyle}}">{{c.code}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
            <span style="font-size: 16px; font-weight: 800; line-height: 1.1">{{c.title}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #D1E8FF">{{c.meta}}</span>
          </span>
        </li>
      </sc-for>
    </ul>
  </section>

  <div style="margin-top: auto; padding: 0 24px 28px 24px; display: flex; flex-direction: column; gap: 10px">
    <a href="Main.dc.html" class="btn rise d5" style="height: 60px; border-radius: 999px; background: #0B1957; color: #F8F3EA; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; text-decoration: none">
      Show me today
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <a href="Core.dc.html" class="btn rise d6" style="height: 48px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">CHANGE MY PICKS</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var PICKS = [
      { code: 'ML', title: 'Machine Learning', meta: 'CORE · SECTION 1' },
      { code: 'LA2', title: 'Linear Algebra II', meta: 'CORE · SECTION 2' },
      { code: 'DS', title: 'Data Structures', meta: 'CORE · SECTION 1' },
      { code: 'STAT', title: 'Statistics for AI', meta: 'CORE · SECTION 2' },
      { code: 'GER', title: 'German A2', meta: 'LS · SECTION 2' },
      { code: 'CV', title: 'Computer Vision', meta: 'ELECTIVE · SECTION 2' }
    ];
    var courses = PICKS.map(function (c, i) {
      return {
        code: c.code, title: c.title, meta: c.meta,
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 8px 0; animation-delay: ' + (420 + i * 60) + 'ms;' + (i ? ' border-top: 1.5px solid #2C3D85;' : ''),
        codeStyle: 'width: 54px; flex: none; text-align: center; font-family: \'JetBrains Mono\', monospace; font-size: 12px; font-weight: 700; padding: 6px 0; border-radius: 10px; background: #9ECCFA; color: #0B1957;'
      };
    });
    return { courses: courses };
  }
}
</script>
</body>
</html>
