<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup — Major</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 220ms ease,color 220ms ease,box-shadow 220ms ease}
.btn:active{transform:scale(0.97)}
.rise{opacity:0;animation:rise 520ms cubic-bezier(0.23,1,0.32,1) forwards}
.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}.d4{animation-delay:200ms}.d5{animation-delay:250ms}.d6{animation-delay:300ms}.d7{animation-delay:350ms}.d8{animation-delay:400ms}
.grow{transform-origin:left center;animation:grow 700ms 150ms cubic-bezier(0.77,0,0.175,1) both}
.pop{animation:pop 260ms cubic-bezier(0.23,1,0.32,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.rise,.pop{animation:fade 200ms ease forwards}.grow{animation:none}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Code.dc.html" aria-label="Back" class="btn" style="width: 48px; height: 48px; border-radius: 999px; border: 2.5px solid #0B1957; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>
      </a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">STEP 1 OF 5 · MAJOR</span>
    </div>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12); overflow: hidden"><span class="grow" style="display: block; height: 100%; background: #0B1957; border-radius: 3px"></span></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12)"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12)"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12)"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12)"></span>
    </div>
  </header>

  <div style="padding: 30px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <h1 class="rise" style="margin: 0; font-size: 52px; line-height: 0.88; font-weight: 800; letter-spacing: -0.05em">What do you study?</h1>
    <p class="rise d1" style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35">Pick your major. We’ll line up the right courses for it.</p>
  </div>

  <div role="radiogroup" aria-label="Major" style="padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto">
    <sc-for list="{{majors}}" as="m" hint-placeholder-count="6">
      <button role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" class="{{m.cls}}" style="{{m.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
          <span style="font-size: 18px; font-weight: 800; line-height: 1.1">{{m.name}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.8">{{m.meta}}</span>
        </span>
        <span style="{{m.dotStyle}}">
          <sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}">
            <svg class="pop" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1957" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 16px 24px 28px 24px">
    <sc-if value="{{picked}}" hint-placeholder-val="{{ false }}">
      <a href="Year.dc.html" class="btn rise" style="height: 60px; border-radius: 999px; background: #0B1957; color: #F8F3EA; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; text-decoration: none; animation-duration: 300ms">
        Continue
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{notPicked}}" hint-placeholder-val="{{ true }}">
      <button disabled style="width: 100%; height: 60px; border-radius: 999px; border: none; background: rgba(11, 25, 87, 0.1); color: rgba(11, 25, 87, 0.55); font-family: inherit; font-size: 18px; font-weight: 800">Pick a major to continue</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    var self = this;
    var MAJORS = [
      { id: 'ai', name: 'Artificial Intelligence', meta: 'B.SC · 4 YEARS' },
      { id: 'cs', name: 'Computer Science', meta: 'B.SC · 4 YEARS' },
      { id: 'ce', name: 'Computer Engineering', meta: 'B.ENG · 4 YEARS' },
      { id: 'geo', name: 'Applied Geosciences', meta: 'B.SC · 4 YEARS' },
      { id: 'upa', name: 'Urban Planning & Architecture', meta: 'B.SC · 4 YEARS' },
      { id: 'log', name: 'Logistics', meta: 'B.SC · 4 YEARS' }
    ];
    var majors = MAJORS.map(function (m, i) {
      var on = self.state.picked === m.id;
      return {
        name: m.name, meta: m.meta, on: on,
        checked: on ? 'true' : 'false',
        cls: 'btn rise d' + Math.min(i + 2, 8),
        pick: function () { self.setState({ picked: m.id }); },
        style: 'min-height: 68px; border-radius: 20px; padding: 12px 16px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-family: inherit; border: none; ' + (on ? 'background: #0B1957; color: #F8F3EA; box-shadow: 0 10px 24px -12px rgba(11,25,87,0.6);' : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.16);'),
        dotStyle: 'width: 28px; height: 28px; border-radius: 999px; flex: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (on ? 'background: #9ECCFA;' : 'border: 2px solid rgba(11, 25, 87, 0.3);')
      };
    });
    return { majors: majors, picked: !!this.state.picked, notPicked: !this.state.picked };
  }
}
</script>
</body>
</html>
