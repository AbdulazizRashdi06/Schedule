<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(0.97)}
.fld{transition:box-shadow 160ms ease}
.fld:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
.in:focus{outline:none}
.mark{transition:background-color 200ms ease,transform 200ms cubic-bezier(0.23,1,0.32,1)}
.tick{animation:tick 200ms cubic-bezier(0.23,1,0.32,1)}
@keyframes tick{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tick{animation:none}}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap">

  <section style="flex: 1 1 420px; background: #0B1957; color: #F8F3EA; padding: 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #D1E8FF">FIRST SIGN-IN</span>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 104px; line-height: 0.84; font-weight: 800; letter-spacing: -0.06em; color: #9ECCFA">New password.</h1>
      
    </div>
    <span style="font-size: 14px; font-weight: 600; color: #D1E8FF">Signed in as rsa.registrar</span>
  </section>

  <section style="flex: 1 1 420px; padding: 56px; box-sizing: border-box; display: flex; align-items: center">
    <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="n" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">NEW PASSWORD</label>
        <div class="fld" style="height: 56px; border-radius: 16px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 16px">
          <input id="n" class="in" type="password" autocomplete="new-password" value="{{pw}}" onChange="{{onPw}}" aria-describedby="rules" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 18px; font-weight: 600; color: #0B1957">
        </div>
      </div>

      <ul id="rules" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600">
            <span class="mark" style="{{r.markStyle}}">
              <sc-if value="{{r.ok}}" hint-placeholder-val="{{ false }}">
                <svg class="tick" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F8F3EA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
              </sc-if>
            </span>
            <span>{{r.text}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.sr}}</span></span>
          </li>
        </sc-for>
      </ul>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="c" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">TYPE IT AGAIN</label>
        <div class="fld" style="height: 56px; border-radius: 16px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 16px">
          <input id="c" class="in" type="password" autocomplete="new-password" value="{{cf}}" onChange="{{onCf}}" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 18px; font-weight: 600; color: #0B1957">
        </div>
        <span aria-live="polite" style="min-height: 20px; font-size: 14px; font-weight: 700; color: #B42318">{{mismatch}}</span>
      </div>

      <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
        <a href="DashHome.dc.html" class="btn" style="height: 56px; border-radius: 999px; background: #0B1957; color: #F8F3EA; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; text-decoration: none">Save and continue</a>
      </sc-if>
      <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
        <button disabled="" style="height: 56px; border-radius: 999px; border: none; background: rgba(11, 25, 87, 0.1); color: rgba(11, 25, 87, 0.6); font-family: inherit; font-size: 17px; font-weight: 800">Save and continue</button>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pw: '', cf: '' };
  }
  renderVals() {
    var self = this;
    var pw = this.state.pw, cf = this.state.cf;
    var checks = [
      { text: 'At least 12 characters', ok: pw.length >= 12 },
      { text: 'Has a number', ok: /\d/.test(pw) },
      { text: 'Not your username', ok: pw.length > 0 && pw.toLowerCase().indexOf('rsa.registrar') < 0 }
    ];
    var allOk = checks.every(function (c) { return c.ok; });
    var match = cf.length > 0 && cf === pw;
    return {
      pw: pw, cf: cf,
      onPw: function (e) { self.setState({ pw: e.target.value }); },
      onCf: function (e) { self.setState({ cf: e.target.value }); },
      rules: checks.map(function (c) {
        return {
          text: c.text, ok: c.ok, sr: c.ok ? ', done' : ', not yet',
          markStyle: 'width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex: none; ' + (c.ok ? 'background: #0B1957;' : 'background: transparent; border: 2px solid rgba(11, 25, 87, 0.3);')
        };
      }),
      mismatch: cf.length >= pw.length && cf.length > 0 && !match ? 'These don’t match yet.' : '',
      ok: allOk && match, notOk: !(allOk && match)
    };
  }
}
</script>
</body>
</html>
