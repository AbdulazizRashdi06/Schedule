<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Majors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(0.97)}
.nav{transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine){.nav:hover{background-color:rgba(11,25,87,0.06)}}
.in:focus{outline:none}
.fld:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
.tick{animation:tick 180ms cubic-bezier(0.23,1,0.32,1)}
@keyframes tick{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tick{animation:none}}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 0 220px; max-width: 100%; box-sizing: border-box; padding: 28px 16px; border-right: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 0 12px 20px 12px">UNI SCHEDULE · STAFF</span>
    <nav aria-label="Dashboard" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DashHome.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Home</a>
      <a href="Upload.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Upload</a>
      <a href="Courses.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Courses</a>
      <a href="Majors.dc.html" aria-current="page" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none; background: #0B1957; color: #F8F3EA">Majors</a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #3A4675; padding: 18px 12px 6px 12px">OWNERS</span>
      <a href="Students.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Students</a>
      <a href="Accounts.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Accounts</a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0 12px; border-top: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800">Abdulaziz</span>
      <span style="font-size: 13px; font-weight: 600; color: #3A4675">Owner</span>
      <a href="StaffSignIn.dc.html" style="font-size: 14px; font-weight: 700; padding-top: 8px">Log out</a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <h1 style="margin: 0; font-size: 56px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em">Majors</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <section aria-label="All majors" style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{majors}}" as="m" hint-placeholder-count="6">
          <button aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" class="btn" style="{{m.style}}">
            <span style="font-size: 16px; font-weight: 800; text-align: left">{{m.name}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; flex: none">{{m.meta}}</span>
          </button>
        </sc-for>
        <div style="display: flex; gap: 8px; padding-top: 10px">
          <div class="fld" style="flex: 1; height: 48px; border-radius: 14px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 14px">
            <label for="nm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New major name</label>
            <input id="nm" class="in" value="{{newName}}" onChange="{{onNew}}" placeholder="New major" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #0B1957">
          </div>
          <button class="btn" onClick="{{add}}" style="height: 48px; padding: 0 18px; border-radius: 999px; border: none; background: #0B1957; color: #F8F3EA; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Add</button>
        </div>
      </section>

      <section aria-label="Selected major" style="flex: 2 1 420px; display: flex; flex-direction: column; gap: 18px; border-top: 2.5px solid #0B1957; padding-top: 18px">
        <sc-if value="{{notRenaming}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
            <h2 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{selName}}</h2>
            <button class="btn" onClick="{{startRename}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.22); color: #0B1957; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; flex: none">Rename</button>
          </div>
        </sc-if>
        <sc-if value="{{renaming}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 8px">
            <div class="fld" style="flex: 1; height: 52px; border-radius: 14px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 14px">
              <label for="rn" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Major name</label>
              <input id="rn" class="in" value="{{draftName}}" onChange="{{onDraft}}" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 20px; font-weight: 800; color: #0B1957">
            </div>
            <button class="btn" onClick="{{saveRename}}" style="height: 52px; padding: 0 20px; border-radius: 999px; border: none; background: #0B1957; color: #F8F3EA; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Save</button>
          </div>
        </sc-if>
        <span style="font-size: 15px; font-weight: 600; color: #3A4675">{{selMeta}}</span>

        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="font-size: 20px; font-weight: 800; padding: 0 0 8px 0">Allowed electives</legend>
          <sc-for list="{{electives}}" as="e" hint-placeholder-count="6">
            <button role="checkbox" aria-checked="{{e.checked}}" onClick="{{e.toggle}}" class="btn" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 6px 8px; border: none; background: transparent; border-radius: 12px; cursor: pointer; font-family: inherit; text-align: left; color: #0B1957">
              <span style="{{e.boxStyle}}">
                <sc-if value="{{e.on}}" hint-placeholder-val="{{ false }}">
                  <svg class="tick" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F8F3EA" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                </sc-if>
              </span>
              <span style="display: flex; flex-direction: column; gap: 1px">
                <span style="font-size: 16px; font-weight: 800">{{e.title}}</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #3A4675">{{e.code}}</span>
              </span>
            </button>
          </sc-for>
        </fieldset>
        <span style="font-size: 14px; font-weight: 600; color: #3A4675">{{summary}}</span>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      majors: [
        { id: 'ai', name: 'Artificial Intelligence', students: 124, allowed: ['CV', 'NLP', 'RL', 'ROB'] },
        { id: 'cs', name: 'Computer Science', students: 98, allowed: ['NLP', 'CV'] },
        { id: 'ce', name: 'Computer Engineering', students: 71, allowed: ['ROB'] },
        { id: 'geo', name: 'Applied Geosciences', students: 46, allowed: [] },
        { id: 'upa', name: 'Urban Planning & Architecture', students: 39, allowed: [] },
        { id: 'log', name: 'Logistics', students: 35, allowed: ['OPS'] },
        { id: 'ds', name: 'Data Science', students: 0, allowed: [], isNew: true }
      ],
      sel: 'ai', renaming: false, draftName: '', newName: ''
    };
  }
  renderVals() {
    var self = this;
    var POOL = [['CV', 'Computer Vision'], ['NLP', 'Natural Language Processing'], ['RL', 'Reinforcement Learning'], ['ROB', 'Robotics Basics'], ['OPS', 'Operations Research'], ['GIS', 'Geographic Info Systems']];
    var s = this.state;
    var sel = s.majors.filter(function (m) { return m.id === s.sel; })[0] || s.majors[0];
    var update = function (id, patch) {
      self.setState({ majors: self.state.majors.map(function (m) { return m.id === id ? Object.assign({}, m, patch) : m; }) });
    };
    return {
      majors: s.majors.map(function (m) {
        var on = m.id === sel.id;
        return {
          name: m.name, pressed: on ? 'true' : 'false',
          meta: m.isNew ? 'NEW' : m.students + ' STUDENTS',
          pick: function () { self.setState({ sel: m.id, renaming: false }); },
          style: 'min-height: 52px; border-radius: 14px; border: none; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; font-family: inherit; ' + (on ? 'background: #0B1957; color: #F8F3EA;' : 'background: transparent; color: #0B1957;')
        };
      }),
      newName: s.newName,
      onNew: function (e) { self.setState({ newName: e.target.value }); },
      add: function () {
        var n = self.state.newName.trim();
        if (!n) return;
        var id = 'm' + Date.now();
        self.setState({ majors: self.state.majors.concat([{ id: id, name: n, students: 0, allowed: [], isNew: true }]), sel: id, newName: '' });
      },
      selName: sel.name,
      selMeta: sel.isNew ? 'No students yet. Pick the electives they can take.' : sel.students + ' students this semester',
      renaming: s.renaming, notRenaming: !s.renaming,
      draftName: s.draftName,
      startRename: function () { self.setState({ renaming: true, draftName: sel.name }); },
      onDraft: function (e) { self.setState({ draftName: e.target.value }); },
      saveRename: function () { var n = self.state.draftName.trim(); if (n) update(sel.id, { name: n }); self.setState({ renaming: false }); },
      electives: POOL.map(function (p) {
        var on = sel.allowed.indexOf(p[0]) >= 0;
        return {
          code: p[0], title: p[1], on: on, checked: on ? 'true' : 'false',
          toggle: function () {
            var a = sel.allowed.slice();
            if (on) a = a.filter(function (x) { return x !== p[0]; }); else a.push(p[0]);
            update(sel.id, { allowed: a });
          },
          boxStyle: 'width: 26px; height: 26px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (on ? 'background: #0B1957;' : 'border: 2px solid rgba(11, 25, 87, 0.35);')
        };
      }),
      summary: sel.allowed.length + ' of ' + POOL.length + ' electives open to ' + sel.name + '. Changes save right away.'
    };
  }
}
</script>
</body>
</html>
