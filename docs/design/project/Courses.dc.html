<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(0.97)}
.nav,.tr{transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine){.nav:hover{background-color:rgba(11,25,87,0.06)}.tr:hover{background-color:rgba(11,25,87,0.04)}}
.in:focus{outline:none}
.fld:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 0 220px; max-width: 100%; box-sizing: border-box; padding: 28px 16px; border-right: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 0 12px 20px 12px">UNI SCHEDULE · STAFF</span>
    <nav aria-label="Dashboard" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DashHome.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Home</a>
      <a href="Upload.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Upload</a>
      <a href="Courses.dc.html" aria-current="page" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none; background: #0B1957; color: #F8F3EA">Courses</a>
      <a href="Majors.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Majors</a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #3A4675; padding: 18px 12px 6px 12px">OWNERS</span>
      <a href="Students.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Students</a>
      <a href="Accounts.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Accounts</a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0 12px; border-top: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800">Abdulaziz</span>
      <span style="font-size: 13px; font-weight: 600; color: #3A4675">Owner</span>
      <a href="StaffSignIn.dc.html" style="font-size: 14px; font-weight: 700; padding-top: 8px">Log out</a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 56px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em">Courses</h1>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">FALL 2026 · {{count}} SHOWN</span>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 280px">
        <label for="cq" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">SEARCH</label>
        <div class="fld" style="height: 48px; border-radius: 14px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 14px">
          <input id="cq" class="in" value="{{q}}" onChange="{{onQ}}" placeholder="Code, title or instructor" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 600; color: #0B1957">
        </div>
      </div>
      <div role="group" aria-label="Filter" style="display: flex; gap: 6px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" class="btn" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="overflow-x: auto">
      <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px">
        <thead>
          <tr style="text-align: left; border-bottom: 2.5px solid #0B1957">
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">CODE</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">TITLE</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">MAJORS</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-align: right">SECTIONS</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-align: right">STUDENTS</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">STATUS</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <tr class="tr" style="border-bottom: 1.5px solid rgba(11, 25, 87, 0.1)">
              <td style="padding: 12px 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><a href="CourseAdmin.dc.html">{{r.code}}</a></td>
              <td style="padding: 12px 8px; font-weight: 800">{{r.title}}</td>
              <td style="padding: 12px 8px; font-weight: 600; color: #3A4675">{{r.majors}}</td>
              <td style="padding: 12px 8px; text-align: right; font-weight: 700">{{r.secs}}</td>
              <td style="padding: 12px 8px; text-align: right; font-weight: 700">{{r.students}}</td>
              <td style="padding: 12px 8px"><span style="{{r.statusStyle}}">{{r.status}}</span></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 20px 0 0 0; font-size: 16px; font-weight: 600">No course matches “{{q}}”.</p>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', f: 'all' };
  }
  renderVals() {
    var self = this;
    var DATA = [
      ['ML', 'Machine Learning', 'AI, CS', 3, 118, 'changed', 'Dr. [name]'],
      ['LA2', 'Linear Algebra II', 'AI, CS, CE', 2, 141, 'issue', ''],
      ['DS', 'Data Structures', 'AI, CS', 2, 96, 'ok', ''],
      ['STAT', 'Statistics for AI', 'AI', 2, 63, 'ok', ''],
      ['CV', 'Computer Vision', 'AI', 2, 34, 'issue', ''],
      ['NLP', 'Natural Language Processing', 'AI, CS', 2, 29, 'issue', ''],
      ['RL', 'Reinforcement Learning', 'AI', 1, 18, 'ok', ''],
      ['GER', 'German A2', 'All', 3, 207, 'ok', ''],
      ['AW', 'Academic Writing', 'All', 2, 88, 'ok', ''],
      ['ETH', 'AI Ethics', 'AI', 1, 57, 'changed', '']
    ];
    var STATUS = { ok: 'OK', changed: 'CHANGED', issue: 'NEEDS FIX' };
    var q = this.state.q.trim().toLowerCase();
    var f = this.state.f;
    var rows = DATA.filter(function (d) {
      if (f === 'issue' && d[5] !== 'issue') return false;
      if (f === 'changed' && d[5] !== 'changed') return false;
      return !q || (d[0] + ' ' + d[1] + ' ' + d[6]).toLowerCase().indexOf(q) >= 0;
    }).map(function (d) {
      return {
        code: d[0], title: d[1], majors: d[2], secs: d[3], students: d[4], status: STATUS[d[5]],
        statusStyle: 'font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 8px; border-radius: 999px; ' + (d[5] === 'issue' ? 'background: #FBE3DF; color: #8F1D12;' : d[5] === 'changed' ? 'background: #D1E8FF; color: #0B1957;' : 'color: #3A4675;')
      };
    });
    var FILTERS = [['all', 'All'], ['issue', 'Needs fix'], ['changed', 'Changed']];
    return {
      q: this.state.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      filters: FILTERS.map(function (x) {
        var on = x[0] === f;
        return {
          label: x[1], pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ f: x[0] }); },
          style: 'height: 48px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 800; ' + (on ? 'background: #0B1957; color: #F8F3EA;' : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.18);')
        };
      }),
      rows: rows, count: rows.length, empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
