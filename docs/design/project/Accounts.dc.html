<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(0.97)}
.nav,.tr{transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine){.nav:hover{background-color:rgba(11,25,87,0.06)}.tr:hover{background-color:rgba(11,25,87,0.04)}}
.scrim{transition:opacity 200ms ease}
.modal{transition:opacity 200ms cubic-bezier(0.23,1,0.32,1),transform 200ms cubic-bezier(0.23,1,0.32,1)}
.reveal{animation:reveal 220ms cubic-bezier(0.23,1,0.32,1)}
.in:focus{outline:none}
.fld:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.modal{transition:opacity 200ms ease}.reveal{animation:none}}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap; position: relative">

  <aside style="flex: 1 0 220px; max-width: 100%; box-sizing: border-box; padding: 28px 16px; border-right: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 0 12px 20px 12px">UNI SCHEDULE · STAFF</span>
    <nav aria-label="Dashboard" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DashHome.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Home</a>
      <a href="Upload.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Upload</a>
      <a href="Courses.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Courses</a>
      <a href="Majors.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Majors</a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #3A4675; padding: 18px 12px 6px 12px">OWNERS</span>
      <a href="Students.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Students</a>
      <a href="Accounts.dc.html" aria-current="page" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none; background: #0B1957; color: #F8F3EA">Accounts</a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0 12px; border-top: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800">Abdulaziz</span>
      <span style="font-size: 13px; font-weight: 600; color: #3A4675">Owner</span>
      <a href="StaffSignIn.dc.html" style="font-size: 14px; font-weight: 700; padding-top: 8px">Log out</a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 56px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em">Accounts</h1>
      <button class="btn" onClick="{{openAdd}}" style="height: 48px; padding: 0 22px; border-radius: 999px; border: none; background: #0B1957; color: #F8F3EA; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Add account</button>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 2.5px solid #0B1957">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div class="tr" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 8px; border-bottom: 1.5px solid rgba(11, 25, 87, 0.1)">
          <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) 110px minmax(0, 1fr) auto; gap: 16px; align-items: center">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; overflow-wrap: anywhere">{{r.user}}</span>
            <span style="{{r.roleStyle}}">{{r.role}}</span>
            <span style="font-size: 14px; font-weight: 600; color: #3A4675">{{r.seen}}</span>
            <sc-if value="{{r.canReset}}" hint-placeholder-val="{{ true }}">
              <button class="btn" onClick="{{r.reset}}" aria-label="{{r.resetAria}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.22); color: #0B1957; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap">Reset password</button>
            </sc-if>
            <sc-if value="{{r.isYou}}" hint-placeholder-val="{{ false }}">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 0 16px">YOU</span>
            </sc-if>
          </div>
          <sc-if value="{{r.hasTemp}}" hint-placeholder-val="{{ false }}">
            <div class="reveal" role="status" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #D1E8FF; border-radius: 16px; padding: 12px 14px">
              <span style="font-size: 14px; font-weight: 700">Temporary password</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.04em">{{r.temp}}</span>
              <span style="font-size: 14px; font-weight: 600">Share it in person. They pick a new one at sign-in.</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

  <div class="scrim" onClick="{{closeAdd}}" style="{{scrimStyle}}"></div>
  <section class="modal" role="dialog" aria-modal="true" aria-label="Add account" style="{{modalStyle}}">
    <h2 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Add account</h2>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nu" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">USERNAME</label>
      <div class="fld" style="height: 52px; border-radius: 14px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 14px">
        <input id="nu" class="in" value="{{newUser}}" onChange="{{onUser}}" placeholder="rsa.examinations" style="flex: 1; border: none; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #0B1957">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span id="rl" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">ROLE</span>
      <div role="radiogroup" aria-labelledby="rl" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{roles}}" as="o" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" class="btn" style="{{o.style}}">
            <span style="font-size: 16px; font-weight: 800">{{o.label}}</span>
            <span style="font-size: 13px; font-weight: 600; text-align: left">{{o.hint}}</span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end">
      <button class="btn" onClick="{{closeAdd}}" style="height: 48px; padding: 0 18px; border-radius: 999px; border: none; background: transparent; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.25); color: #0B1957; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Cancel</button>
      <button class="btn" onClick="{{create}}" style="{{createStyle}}">Create account</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      accounts: [
        { user: 'abdulaziz', role: 'Owner', seen: 'Signed in today', you: true },
        { user: 'rsa.registrar', role: 'RSA', seen: 'Signed in today' },
        { user: 'rsa.scheduling', role: 'RSA', seen: 'Never signed in' }
      ],
      temps: {}, add: false, newUser: '', newRole: 'RSA'
    };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var gen = function () {
      var w = ['ramp', 'dune', 'wadi', 'reef', 'kite', 'loom', 'fort'];
      return 'k' + Math.floor(Math.random() * 9 + 1) + '-' + w[Math.floor(Math.random() * w.length)] + '-' + Math.floor(1000 + Math.random() * 8999);
    };
    var valid = /^[a-z0-9._]{3,}$/.test(s.newUser.trim());
    return {
      rows: s.accounts.map(function (a) {
        return {
          user: a.user, role: a.role, seen: a.seen,
          isYou: !!a.you, canReset: !a.you,
          resetAria: 'Reset password for ' + a.user,
          reset: function () { var t = Object.assign({}, self.state.temps); t[a.user] = gen(); self.setState({ temps: t }); },
          hasTemp: !!s.temps[a.user], temp: s.temps[a.user] || '',
          roleStyle: 'justify-self: start; font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 10px; border-radius: 999px; ' + (a.role === 'Owner' ? 'background: #0B1957; color: #F8F3EA;' : 'background: #D1E8FF; color: #0B1957;')
        };
      }),
      openAdd: function () { self.setState({ add: true }); },
      closeAdd: function () { self.setState({ add: false }); },
      newUser: s.newUser,
      onUser: function (e) { self.setState({ newUser: e.target.value.toLowerCase() }); },
      roles: [['RSA', 'Uploads, courses, majors'], ['Owner', 'Everything, plus students and accounts']].map(function (r) {
        var on = r[0] === s.newRole;
        return {
          label: r[0], hint: r[1], checked: on ? 'true' : 'false',
          pick: function () { self.setState({ newRole: r[0] }); },
          style: 'min-height: 76px; border-radius: 16px; border: none; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; cursor: pointer; font-family: inherit; ' + (on ? 'background: #0B1957; color: #F8F3EA;' : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.16);')
        };
      }),
      createStyle: 'height: 48px; padding: 0 22px; border-radius: 999px; border: none; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; ' + (valid ? 'background: #0B1957; color: #F8F3EA;' : 'background: rgba(11, 25, 87, 0.1); color: rgba(11, 25, 87, 0.55);'),
      create: function () {
        if (!valid) return;
        var u = self.state.newUser.trim();
        var t = Object.assign({}, self.state.temps); t[u] = gen();
        self.setState({ accounts: self.state.accounts.concat([{ user: u, role: self.state.newRole, seen: 'Never signed in' }]), temps: t, add: false, newUser: '' });
      },
      scrimStyle: 'position: absolute; inset: 0; background: rgba(11, 25, 87, 0.35); z-index: 3; ' + (s.add ? 'opacity: 1;' : 'opacity: 0; pointer-events: none;'),
      modalStyle: 'position: absolute; left: 50%; top: 50%; z-index: 4; width: 460px; max-width: calc(100% - 32px); box-sizing: border-box; background: #F8F3EA; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 32px 64px -24px rgba(11, 25, 87, 0.55); ' + (s.add ? 'opacity: 1; transform: translate(-50%, -50%) scale(1);' : 'opacity: 0; transform: translate(-50%, -50%) scale(0.96); pointer-events: none;')
    };
  }
}
</script>
</body>
</html>
