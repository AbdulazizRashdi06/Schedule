<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.nav{transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine){.nav:hover{background-color:rgba(11,25,87,0.06)}}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 0 220px; max-width: 100%; box-sizing: border-box; padding: 28px 16px; border-right: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 0 12px 20px 12px">UNI SCHEDULE · STAFF</span>
    <nav aria-label="Dashboard" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DashHome.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Home</a>
      <a href="Upload.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Upload</a>
      <a href="Courses.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Courses</a>
      <a href="Majors.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Majors</a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #3A4675; padding: 18px 12px 6px 12px">OWNERS</span>
      <a href="Students.dc.html" aria-current="page" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none; background: #0B1957; color: #F8F3EA">Students</a>
      <a href="Accounts.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Accounts</a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0 12px; border-top: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800">Abdulaziz</span>
      <span style="font-size: 13px; font-weight: 600; color: #3A4675">Owner</span>
      <a href="StaffSignIn.dc.html" style="font-size: 14px; font-weight: 700; padding-top: 8px">Log out</a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <a href="Students.dc.html" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">← ALL STUDENTS</a>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -0.02em">24-0161</h1>
      <span style="font-size: 17px; font-weight: 700">Artificial Intelligence, Year 3</span>
      <span style="font-size: 15px; font-weight: 600; color: #3A4675">Setup done 3 Oct. Last seen today at 09:52.</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
      <section style="flex: 1 1 300px; display: flex; flex-direction: column">
        <h2 style="margin: 0 0 10px 0; font-size: 24px; font-weight: 800">Picks</h2>
        <sc-for list="{{picks}}" as="p" hint-placeholder-count="6">
          <div style="{{p.rowStyle}}">
            <span style="width: 52px; flex: none; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 6px 0; border-radius: 10px; background: #D1E8FF">{{p.code}}</span>
            <span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
              <span style="font-size: 16px; font-weight: 800">{{p.title}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #3A4675">{{p.meta}}</span>
            </span>
          </div>
        </sc-for>
      </section>

      <section style="flex: 2 1 460px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 24px; font-weight: 800">Timetable</h2>
        <div role="table" aria-label="Weekly timetable" style="display: grid; grid-template-columns: 56px repeat(5, minmax(0, 1fr)); gap: 6px">
          <span role="columnheader"></span>
          <sc-for list="{{dayHeads}}" as="d" hint-placeholder-count="5">
            <span role="columnheader" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-align: center; padding-bottom: 4px">{{d}}</span>
          </sc-for>
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="36">
            <span role="cell" style="{{c.style}}">{{c.text}}</span>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var SLOT = ['08:00', '09:45', '11:30', '13:15', '15:00', '16:45'];
    var DAYS = ['sun', 'mon', 'tue', 'wed', 'thu'];
    var PICKS = [
      ['ML', 'Machine Learning', 'CORE, SECTION 1', 'lecture'],
      ['LA2', 'Linear Algebra II', 'CORE, SECTION 2', 'tutorial'],
      ['DS', 'Data Structures', 'CORE, SECTION 1', 'lab'],
      ['STAT', 'Statistics for AI', 'CORE, SECTION 2', 'lab'],
      ['GER', 'German A2', 'LS, SECTION 2', 'tutorial'],
      ['CV', 'Computer Vision', 'ELECTIVE, SECTION 2', 'lecture']
    ];
    var AT = { sun1: 'ML', tue1: 'ML', mon0: 'LA2', wed3: 'LA2', sun4: 'DS', tue3: 'DS', tue0: 'STAT', thu0: 'STAT', mon1: 'GER', thu2: 'GER', mon2: 'CV', thu3: 'CV' };
    var TYPE = {}; PICKS.forEach(function (p) { TYPE[p[0]] = p[3]; });
    var COLORS = { lecture: '#0B1957', lab: '#D1E8FF', tutorial: '#9ECCFA' };
    var cells = [];
    SLOT.forEach(function (t, s) {
      cells.push({ text: t, style: 'font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 700; display: flex; align-items: center; height: 44px;' });
      DAYS.forEach(function (d) {
        var c = AT[d + s];
        cells.push({
          text: c || '',
          style: 'height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: \'JetBrains Mono\', monospace; font-size: 12px; font-weight: 700; ' + (c ? 'background: ' + COLORS[TYPE[c]] + '; color: ' + (TYPE[c] === 'lecture' ? '#F8F3EA' : '#0B1957') + ';' : 'box-shadow: inset 0 0 0 1.5px rgba(11, 25, 87, 0.1);')
        });
      });
    });
    return {
      picks: PICKS.map(function (p, i) {
        return { code: p[0], title: p[1], meta: p[2], rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 10px 0;' + (i ? ' border-top: 1.5px solid rgba(11, 25, 87, 0.1);' : '') };
      }),
      dayHeads: ['SUN', 'MON', 'TUE', 'WED', 'THU'],
      cells: cells
    };
  }
}
</script>
</body>
</html>
