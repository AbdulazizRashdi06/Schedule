<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Students</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(0.97)}
.nav,.tr{transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine){.nav:hover{background-color:rgba(11,25,87,0.06)}.tr:hover{background-color:rgba(11,25,87,0.04)}}
.in:focus{outline:none}
.fld:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 0 220px; max-width: 100%; box-sizing: border-box; padding: 28px 16px; border-right: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; padding: 0 12px 20px 12px">UNI SCHEDULE · STAFF</span>
    <nav aria-label="Dashboard" style="display: flex; flex-direction: column; gap: 2px">
      <a href="DashHome.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Home</a>
      <a href="Upload.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Upload</a>
      <a href="Courses.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Courses</a>
      <a href="Majors.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Majors</a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #3A4675; padding: 18px 12px 6px 12px">OWNERS</span>
      <a href="Students.dc.html" aria-current="page" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 800; text-decoration: none; background: #0B1957; color: #F8F3EA">Students</a>
      <a href="Accounts.dc.html" class="nav" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none">Accounts</a>
    </nav>
    <div style="margin-top: auto; padding: 16px 12px 0 12px; border-top: 1.5px solid rgba(11, 25, 87, 0.1); display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800">Abdulaziz</span>
      <span style="font-size: 13px; font-weight: 600; color: #3A4675">Owner</span>
      <a href="StaffSignIn.dc.html" style="font-size: 14px; font-weight: 700; padding-top: 8px">Log out</a>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 56px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em">Students</h1>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">ONLY OWNERS SEE THIS</span>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 280px">
        <label for="sq" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">SEARCH BY ID</label>
        <div class="fld" style="height: 48px; border-radius: 14px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 14px">
          <input id="sq" class="in" inputmode="numeric" value="{{q}}" onChange="{{onQ}}" placeholder="24-0161" style="flex: 1; border: none; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #0B1957">
        </div>
      </div>
      <div role="group" aria-label="Filter" style="display: flex; gap: 6px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" class="btn" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="overflow-x: auto">
      <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px">
        <thead>
          <tr style="text-align: left; border-bottom: 2.5px solid #0B1957">
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">ID</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">MAJOR</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-align: right">YEAR</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-align: right">COURSES</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">SETUP</th>
            <th scope="col" style="padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em">LAST SEEN</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <tr class="tr" style="border-bottom: 1.5px solid rgba(11, 25, 87, 0.1)">
              <td style="padding: 12px 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700"><a href="StudentDetail.dc.html">{{r.id}}</a></td>
              <td style="padding: 12px 8px; font-weight: 700">{{r.major}}</td>
              <td style="padding: 12px 8px; text-align: right; font-weight: 700">{{r.year}}</td>
              <td style="padding: 12px 8px; text-align: right; font-weight: 700">{{r.courses}}</td>
              <td style="padding: 12px 8px"><span style="{{r.setupStyle}}">{{r.setup}}</span></td>
              <td style="padding: 12px 8px; font-weight: 600; color: #3A4675">{{r.seen}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 20px 0 0 0; font-size: 16px; font-weight: 600">No student with that ID has signed in.</p>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', f: 'all' };
  }
  renderVals() {
    var self = this;
    var DATA = [
      ['24-0161', 'Artificial Intelligence', 3, 6, 'done', 'Today 09:52'],
      ['24-0178', 'Artificial Intelligence', 3, 5, 'done', 'Today 08:14'],
      ['25-0342', 'Computer Science', 2, 0, 'stuck', 'Yesterday'],
      ['23-0057', 'Computer Engineering', 4, 6, 'done', '8 Oct'],
      ['26-0419', 'Logistics', 1, 0, 'stuck', '6 Oct'],
      ['25-0233', 'Applied Geosciences', 2, 5, 'done', 'Today 10:31'],
      ['26-0288', 'Artificial Intelligence', 1, 4, 'done', 'Yesterday'],
      ['24-0390', 'Urban Planning & Architecture', 3, 0, 'stuck', '4 Oct']
    ];
    var q = this.state.q.trim();
    var f = this.state.f;
    var rows = DATA.filter(function (d) {
      if (f === 'stuck' && d[4] !== 'stuck') return false;
      if (f === 'done' && d[4] !== 'done') return false;
      return !q || d[0].indexOf(q) >= 0;
    }).map(function (d) {
      return {
        id: d[0], major: d[1], year: d[2], courses: d[3] || '-', seen: d[5],
        setup: d[4] === 'done' ? 'DONE' : 'STUCK',
        setupStyle: 'font-family: \'JetBrains Mono\', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 8px; border-radius: 999px; ' + (d[4] === 'stuck' ? 'background: #FBE3DF; color: #8F1D12;' : 'color: #3A4675;')
      };
    });
    var FILTERS = [['all', 'All'], ['stuck', 'Stuck in setup'], ['done', 'Done']];
    return {
      q: this.state.q,
      onQ: function (e) { self.setState({ q: e.target.value.replace(/[^\d-]/g, '') }); },
      filters: FILTERS.map(function (x) {
        var on = x[0] === f;
        return {
          label: x[1], pressed: on ? 'true' : 'false',
          pick: function () { self.setState({ f: x[0] }); },
          style: 'height: 48px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 800; ' + (on ? 'background: #0B1957; color: #F8F3EA;' : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.18);')
        };
      }),
      rows: rows, empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
