<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup — LS courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
.btn:active{transform:scale(0.96)}
.card{transition:box-shadow 220ms ease,background-color 220ms ease}
.rise{opacity:0;animation:rise 520ms cubic-bezier(0.23,1,0.32,1) forwards}
.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}.d4{animation-delay:200ms}.d5{animation-delay:250ms}.d6{animation-delay:300ms}
.grow{transform-origin:left center;animation:grow 700ms 150ms cubic-bezier(0.77,0,0.175,1) both}
.pop{animation:pop 240ms cubic-bezier(0.23,1,0.32,1)}
.open{animation:warn 280ms cubic-bezier(0.23,1,0.32,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
@keyframes warn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.rise,.pop,.open{animation:fade 200ms ease forwards}.grow{animation:none}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Core.dc.html" aria-label="Back" class="btn" style="width: 48px; height: 48px; border-radius: 999px; border: 2.5px solid #0B1957; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>
      </a>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">STEP 4 OF 5 · LS</span>
    </div>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="4" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 3px; background: #0B1957"></span>
      <span style="height: 6px; border-radius: 3px; background: #0B1957"></span>
      <span style="height: 6px; border-radius: 3px; background: #0B1957"></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12); overflow: hidden"><span class="grow" style="display: block; height: 100%; background: #0B1957; border-radius: 3px"></span></span>
      <span style="height: 6px; border-radius: 3px; background: rgba(11, 25, 87, 0.12)"></span>
    </div>
  </header>

  <div style="padding: 24px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <h1 class="rise" style="margin: 0; font-size: 46px; line-height: 0.9; font-weight: 800; letter-spacing: -0.05em">Any LS courses?</h1>
    <p class="rise d1" style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35">Tick the ones you’re taking this semester. Skip if none.</p>
  </div>

  <div style="padding: 18px 24px 8px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto">
    <sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
      <div class="{{c.cls}}" style="{{c.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <button role="checkbox" aria-checked="{{c.checked}}" aria-label="{{c.toggleLabel}}" onClick="{{c.toggle}}" class="btn" style="{{c.boxStyle}}">
            <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
              <svg class="pop" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F8F3EA" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
          </button>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
            <span style="font-size: 17px; font-weight: 800; line-height: 1.1">{{c.title}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; opacity: 0.75">{{c.meta}}</span>
          </span>
        </div>
        <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
          <div class="open" style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; gap: 8px; padding-left: 44px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; opacity: 0.7">SEC</span>
              <div role="radiogroup" aria-label="{{c.secLabel}}" style="display: flex; gap: 6px">
                <sc-for list="{{c.sections}}" as="s" hint-placeholder-count="2">
                  <button role="radio" aria-checked="{{s.checked}}" aria-label="{{s.aria}}" onClick="{{s.pick}}" class="btn" style="{{s.style}}">{{s.n}}</button>
                </sc-for>
              </div>
            </div>
            <span style="padding-left: 44px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500">{{c.when}}</span>
            <sc-if value="{{c.hasClash}}" hint-placeholder-val="{{ false }}">
              <div class="open" role="alert" style="margin-left: 44px; display: flex; gap: 8px; align-items: flex-start; background: #FBE3DF; color: #8F1D12; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; line-height: 1.3">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path></svg>
                {{c.clashText}}
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 24px 28px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -12px 20px -16px rgba(11,25,87,0.35)">
    <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em">{{summary}}</span>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ true }}">
      <a href="Electives.dc.html" class="btn" style="height: 60px; border-radius: 999px; background: #0B1957; color: #F8F3EA; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 800; text-decoration: none">
        {{ctaLabel}}
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{blocked}}" hint-placeholder-val="{{ false }}">
      <button disabled style="width: 100%; height: 60px; border-radius: 999px; border: none; background: rgba(11, 25, 87, 0.1); color: rgba(11, 25, 87, 0.6); font-family: inherit; font-size: 18px; font-weight: 800">Fix the clash to continue</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: {}, sec: { GER: 1, AW: 1, RS: 1 } };
  }
  renderVals() {
    var self = this;
    var SLOT = ['08:00', '09:45', '11:30', '13:15', '15:00', '16:45'];
    var DAY = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu' };
    // Core picks from the previous step (ML 1, LA2 2, DS 1, STAT 2)
    var CORE = { sun1: 'ML', tue1: 'ML', mon0: 'LA2', wed3: 'LA2', sun4: 'DS', tue3: 'DS', tue0: 'STAT', thu0: 'STAT' };
    var COURSES = [
      { code: 'GER', title: 'German A2', meta: 'LS · 3 CREDITS', secs: { 1: [['sun', 1], ['wed', 1]], 2: [['mon', 1], ['thu', 2]] } },
      { code: 'AW', title: 'Academic Writing', meta: 'LS · 2 CREDITS', secs: { 1: [['wed', 4]], 2: [['thu', 3]] } },
      { code: 'RS', title: 'Research Skills', meta: 'LS · 2 CREDITS', secs: { 1: [['mon', 4]], 2: [['sun', 2]] } }
    ];
    var on = this.state.on, sec = this.state.sec;
    var taken = Object.assign({}, CORE);
    COURSES.forEach(function (c) {
      if (!on[c.code]) return;
      c.secs[sec[c.code]].forEach(function (m) { if (!taken[m[0] + m[1]]) taken[m[0] + m[1]] = c.code; });
    });
    var clashes = 0, count = 0;
    var courses = COURSES.map(function (c, i) {
      var isOn = !!on[c.code];
      var meets = c.secs[sec[c.code]];
      var clashWith = null, clashAt = null;
      if (isOn) {
        count++;
        meets.forEach(function (m) {
          var who = taken[m[0] + m[1]];
          if (who && who !== c.code && !clashWith) { clashWith = who; clashAt = DAY[m[0]] + ' ' + SLOT[m[1]]; }
        });
      }
      if (clashWith) clashes++;
      return {
        title: c.title, meta: c.meta, on: isOn,
        cls: 'card rise d' + (i + 2),
        checked: isOn ? 'true' : 'false',
        toggleLabel: (isOn ? 'Remove ' : 'Add ') + c.title,
        secLabel: c.title + ' section',
        toggle: function () { var o = Object.assign({}, self.state.on); o[c.code] = !o[c.code]; self.setState({ on: o }); },
        sections: Object.keys(c.secs).map(function (n) {
          var picked = String(sec[c.code]) === n;
          return {
            n: n, checked: picked ? 'true' : 'false', aria: 'Section ' + n,
            pick: function () { var s = Object.assign({}, self.state.sec); s[c.code] = +n; self.setState({ sec: s }); },
            style: 'width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer; font-family: \'JetBrains Mono\', monospace; font-size: 16px; font-weight: 700; ' + (picked ? (clashWith ? 'background: #8F1D12; color: #F8F3EA;' : 'background: #0B1957; color: #F8F3EA;') : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2);')
          };
        }),
        when: meets.map(function (m) { return DAY[m[0]] + ' ' + SLOT[m[1]]; }).join('  ·  '),
        hasClash: !!clashWith,
        clashText: clashWith ? 'Clashes with ' + clashWith + ' on ' + clashAt + '. Try another section.' : '',
        cardStyle: 'border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; ' + (isOn ? 'background: #FFFDF8; box-shadow: 0 0 0 2px ' + (clashWith ? '#E9A99F' : 'rgba(11, 25, 87, 0.1)') + ';' : 'background: transparent; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.12);'),
        boxStyle: 'width: 32px; height: 32px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ' + (isOn ? 'background: #0B1957; border: none;' : 'background: transparent; border: 2px solid rgba(11, 25, 87, 0.35);')
      };
    });
    return {
      courses: courses,
      summary: count ? count + ' LS ' + (count === 1 ? 'COURSE' : 'COURSES') + ' PICKED' : 'NONE PICKED · THAT’S FINE',
      ok: clashes === 0,
      blocked: clashes > 0,
      ctaLabel: count ? 'Continue' : 'Skip for now'
    };
  }
}
</script>
</body>
</html>
