<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, next class</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
.btn:active{transform:scale(0.97)}
.tick{display:inline-block;animation:tick 260ms cubic-bezier(0.23,1,0.32,1)}
@keyframes tick{from{opacity:0;transform:translateY(-10px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion: reduce){.tick{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 28px 24px 0 24px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">SUN 11 OCT</span>
      <h1 style="margin: 0; font-size: 76px; line-height: 0.86; font-weight: 800; letter-spacing: -0.05em">Today.</h1>
    </div>
    <a href="Menu.dc.html" class="btn" style="height: 48px; padding: 0 18px; border-radius: 999px; border: 2.5px solid #0B1957; box-sizing: border-box; display: flex; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-decoration: none; margin-top: 4px">MENU</a>
  </header>

  <a href="Course.dc.html" class="btn" style="margin: 22px 12px 0 12px; background: #0B1957; color: #F8F3EA; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; gap: 14px; text-decoration: none">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #D1E8FF">NEXT IN</span>
    <span aria-live="polite" style="font-size: 96px; font-weight: 800; line-height: 0.8; letter-spacing: -0.06em; color: #9ECCFA"><sc-if value="{{even}}" hint-placeholder-val="{{ true }}"><span class="tick">{{mins}}</span></sc-if><sc-if value="{{odd}}" hint-placeholder-val="{{ false }}"><span class="tick">{{mins}}</span></sc-if> min</span>
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Linear Algebra II</span>
      <span style="font-size: 15px; color: #D1E8FF">Tutorial in C-112, starts 13:15</span>
    </span>
    <span style="font-size: 14px; font-weight: 600; color: #D1E8FF; padding-top: 12px; border-top: 1.5px solid #2C3D85">{{gapLine}}</span>
  </a>

  <section style="padding: 22px 24px 0 24px; display: flex; flex-direction: column">
    <h2 style="margin: 0 0 8px 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Later today</h2>
    <a href="Course.dc.html" style="display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px 0; border-top: 2.5px solid #0B1957; text-decoration: none">
      <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.05em; line-height: 1">15:00</span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 800; line-height: 1.1">Data Structures Lab</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">LAB, IT-LAB 3</span>
      </span>
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mins: 47, n: 0 };
  }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (self.state.mins > 1) self.setState({ mins: self.state.mins - 1, n: self.state.n + 1 });
    }, 4000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var m = this.state.mins;
    return {
      mins: m,
      even: this.state.n % 2 === 0,
      odd: this.state.n % 2 === 1,
      gapLine: m > 20 ? 'Time for lunch or a coffee first.' : 'Head over now, it’s a short walk.'
    };
  }
}
</script>
</body>
</html>
