<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 200ms ease,color 200ms ease}
.btn:active{transform:scale(0.97)}
.lbl{display:inline-block;animation:swap 200ms cubic-bezier(0.23,1,0.32,1)}
@keyframes swap{from{opacity:0;filter:blur(2px);transform:translateY(3px)}to{opacity:1;filter:blur(0);transform:none}}
@media (prefers-reduced-motion: reduce){.lbl{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div role="status" style="margin: 20px 12px 0 12px; background: #0B1957; color: #F8F3EA; border-radius: 24px; padding: 14px 12px 14px 18px; display: flex; align-items: center; gap: 10px">
    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
      <span style="font-size: 16px; font-weight: 800">{{title}}</span>
      <span style="font-size: 13px; font-weight: 600; color: #D1E8FF">Showing what we saved at 08:12. It may be out of date.</span>
    </span>
    <button class="btn" onClick="{{retry}}" aria-disabled="{{busy}}" style="height: 44px; min-width: 88px; padding: 0 14px; border-radius: 999px; border: none; background: #9ECCFA; color: #0B1957; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; flex: none">
      <sc-if value="{{trying}}" hint-placeholder-val="{{ false }}"><span class="lbl">Trying…</span></sc-if>
      <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><span class="lbl">Retry</span></sc-if>
    </button>
  </div>

  <header style="padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">SUN 11 OCT</span>
    <h1 style="margin: 0; font-size: 76px; line-height: 0.86; font-weight: 800; letter-spacing: -0.05em">Today.</h1>
  </header>

  <section style="margin: 22px 12px 0 12px; background: #0B1957; color: #F8F3EA; border-radius: 32px; padding: 22px; display: flex; flex-direction: column; gap: 12px; opacity: 0.92">
    <span style="font-size: 96px; font-weight: 800; line-height: 0.8; letter-spacing: -0.06em; color: #9ECCFA">09:45</span>
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Machine Learning</span>
      <span style="font-size: 15px; color: #D1E8FF">Lecture in B-204</span>
    </span>
  </section>

  <section style="padding: 22px 24px 0 24px; display: flex; flex-direction: column">
    <h2 style="margin: 0 0 8px 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Up next</h2>
    <div style="display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px 0; border-top: 2.5px solid #0B1957">
      <span style="font-size: 34px; font-weight: 800; letter-spacing: -0.05em; line-height: 1">15:00</span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 800; line-height: 1.1">Data Structures Lab</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">LAB, IT-LAB 3</span>
      </span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { trying: false, tries: 0 };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this;
    var s = this.state;
    return {
      title: s.tries ? 'Still offline' : 'You’re offline',
      trying: s.trying, idle: !s.trying,
      busy: s.trying ? 'true' : 'false',
      retry: function () {
        if (self.state.trying) return;
        self.setState({ trying: true });
        clearTimeout(self.t);
        self.t = setTimeout(function () { self.setState({ trying: false, tries: self.state.tries + 1 }); }, 1100);
      }
    };
  }
}
</script>
</body>
</html>
