<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit my courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden}
a{color:#0B1957}a:hover{color:#1d2f80}
.btn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
.btn:active{transform:scale(0.97)}
.row{transition:opacity 200ms ease}
.warn{animation:warn 220ms cubic-bezier(0.23,1,0.32,1)}
.scrim{transition:opacity 240ms ease}
.sheet{transition:transform 320ms cubic-bezier(0.32,0.72,0,1)}
.bar{transition:transform 260ms cubic-bezier(0.23,1,0.32,1)}
.toast{transition:transform 260ms cubic-bezier(0.23,1,0.32,1),opacity 200ms ease}
.q:focus{outline:none}
.qwrap:focus-within{box-shadow:inset 0 0 0 2.5px #0B1957,0 0 0 4px #D1E8FF}
@keyframes warn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sheet,.bar,.toast{transition:opacity 200ms ease}.warn{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F3EA; color: #0B1957; font-family: 'Bricolage Grotesque', Georgia, serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 28px 24px 0 24px; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Back to today" class="btn" style="width: 48px; height: 48px; border-radius: 999px; border: 2.5px solid #0B1957; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">FALL 2026</span>
  </header>

  <div style="padding: 20px 24px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
    <h1 style="margin: 0; font-size: 52px; line-height: 0.88; font-weight: 800; letter-spacing: -0.05em">My courses</h1>
    <button class="btn" onClick="{{openSheet}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: #0B1957; color: #F8F3EA; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; flex: none">Add course</button>
  </div>

  <div style="padding: 18px 24px 120px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div class="row" style="{{r.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 52px; flex: none; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 12px; background: #D1E8FF">{{r.code}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
            <span style="{{r.titleStyle}}">{{r.title}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #3A4675">{{r.kind}}</span>
          </span>
          <button class="btn" onClick="{{r.toggleDrop}}" aria-label="{{r.dropAria}}" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #0B1957; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">{{r.dropLabel}}</button>
        </div>
        <sc-if value="{{r.live}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 6px; padding-left: 64px; flex-wrap: wrap">
            <div role="radiogroup" aria-label="{{r.secLabel}}" style="display: flex; gap: 6px">
              <sc-for list="{{r.sections}}" as="s" hint-placeholder-count="3">
                <button role="radio" aria-checked="{{s.checked}}" aria-label="{{s.aria}}" onClick="{{s.pick}}" class="btn" style="{{s.style}}">{{s.n}}</button>
              </sc-for>
            </div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-left: 4px">{{r.when}}</span>
          </div>
          <sc-if value="{{r.hasClash}}" hint-placeholder-val="{{ false }}">
            <div class="warn" role="alert" style="margin-left: 64px; background: #FBE3DF; color: #8F1D12; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; line-height: 1.3">{{r.clashText}}</div>
          </sc-if>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div class="toast" role="status" aria-live="polite" style="{{toastStyle}}">Saved. Your week is updated.</div>

  <div class="bar" style="{{barStyle}}">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 800">{{changeLabel}}</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #D1E8FF">{{barHint}}</span>
    </span>
    <button class="btn" onClick="{{save}}" aria-disabled="{{saveDisabled}}" style="{{saveStyle}}">{{saveLabel}}</button>
  </div>

  <div class="scrim" onClick="{{closeSheet}}" style="{{scrimStyle}}"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Add a course" style="{{sheetStyle}}">
    <span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: rgba(11, 25, 87, 0.2); align-self: center"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">Add a course</h2>
      <button class="btn" onClick="{{closeSheet}}" style="height: 44px; padding: 0 4px; border: none; background: transparent; color: #0B1957; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">CLOSE</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="q" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">SEARCH</label>
      <div class="qwrap" style="height: 52px; border-radius: 16px; background: #FFFDF8; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2); display: flex; align-items: center; padding: 0 16px">
        <input id="q" class="q" value="{{q}}" onChange="{{onQ}}" placeholder="Name or code" style="flex: 1; border: none; background: transparent; font-family: inherit; font-size: 17px; font-weight: 600; color: #0B1957">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; overflow-y: auto">
      <sc-for list="{{available}}" as="a" hint-placeholder-count="4">
        <div style="{{a.rowStyle}}">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
            <span style="font-size: 16px; font-weight: 800">{{a.title}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #3A4675">{{a.meta}}</span>
          </span>
          <button class="btn" onClick="{{a.add}}" aria-label="{{a.aria}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: #D1E8FF; color: #0B1957; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Add</button>
        </div>
      </sc-for>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 12px 0 0 0; font-size: 15px; font-weight: 600">Nothing matches. Only courses open to your major show here.</p>
      </sc-if>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.start = { ML: 1, LA2: 2, DS: 1, STAT: 2, GER: 2, CV: 2 };
    this.state = { sec: Object.assign({}, this.start), dropped: {}, added: [], sheet: false, q: '', saving: false, toast: false };
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  renderVals() {
    var self = this;
    var SLOT = ['08:00', '09:45', '11:30', '13:15', '15:00', '16:45'];
    var DAY = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu' };
    var ALL = {
      ML: { title: 'Machine Learning', kind: 'CORE', secs: { 1: [['sun', 1], ['tue', 1]], 2: [['mon', 2], ['wed', 2]], 3: [['sun', 4], ['tue', 4]] } },
      LA2: { title: 'Linear Algebra II', kind: 'CORE', secs: { 1: [['sun', 1], ['wed', 0]], 2: [['mon', 0], ['wed', 3]], 3: [['thu', 1], ['tue', 3]] } },
      DS: { title: 'Data Structures', kind: 'CORE', secs: { 1: [['sun', 4], ['tue', 3]], 2: [['mon', 3], ['thu', 2]] } },
      STAT: { title: 'Statistics for AI', kind: 'CORE', secs: { 1: [['mon', 0], ['wed', 2]], 2: [['tue', 0], ['thu', 0]] } },
      GER: { title: 'German A2', kind: 'LS', secs: { 1: [['sun', 1], ['wed', 1]], 2: [['mon', 1], ['thu', 2]] } },
      CV: { title: 'Computer Vision', kind: 'ELECTIVE', secs: { 1: [['sun', 2], ['wed', 2]], 2: [['mon', 2], ['thu', 3]] } },
      NLP: { title: 'Natural Language Processing', kind: 'ELECTIVE', secs: { 1: [['tue', 2], ['thu', 2]], 2: [['wed', 4], ['sun', 2]] } },
      RL: { title: 'Reinforcement Learning', kind: 'ELECTIVE', secs: { 1: [['mon', 3], ['wed', 5]] } },
      AW: { title: 'Academic Writing', kind: 'LS', secs: { 1: [['wed', 4]], 2: [['thu', 3]] } },
      RS: { title: 'Research Skills', kind: 'LS', secs: { 1: [['mon', 4]], 2: [['sun', 2]] } }
    };
    var s = this.state;
    var codes = Object.keys(this.start).concat(s.added);
    var active = codes.filter(function (c) { return !s.dropped[c]; });
    var taken = {};
    active.forEach(function (c) {
      ALL[c].secs[s.sec[c]].forEach(function (m) { (taken[m[0] + m[1]] = taken[m[0] + m[1]] || []).push(c); });
    });
    var clashes = 0;
    var rows = codes.map(function (c) {
      var d = ALL[c];
      var dropped = !!s.dropped[c];
      var isNew = s.added.indexOf(c) >= 0;
      var meets = d.secs[s.sec[c]];
      var clashWith = null, at = null;
      if (!dropped) meets.forEach(function (m) {
        var o = taken[m[0] + m[1]].filter(function (x) { return x !== c; });
        if (o.length && !clashWith) { clashWith = o[0]; at = DAY[m[0]] + ' ' + SLOT[m[1]]; }
      });
      if (clashWith) clashes++;
      var changed = !isNew && !dropped && s.sec[c] !== self.start[c];
      var tag = dropped ? 'DROPPED' : isNew ? 'NEW' : changed ? 'SECTION CHANGED' : d.kind;
      return {
        code: c, title: d.title, kind: tag, live: !dropped,
        titleStyle: 'font-size: 16px; font-weight: 800; line-height: 1.15;' + (dropped ? ' text-decoration: line-through;' : ''),
        dropLabel: dropped ? 'UNDO' : 'DROP',
        dropAria: (dropped ? 'Undo drop of ' : 'Drop ') + d.title,
        toggleDrop: function () {
          if (isNew && !dropped) { self.setState({ added: self.state.added.filter(function (x) { return x !== c; }) }); return; }
          var dd = Object.assign({}, self.state.dropped); dd[c] = !dd[c]; self.setState({ dropped: dd });
        },
        secLabel: d.title + ' section',
        sections: Object.keys(d.secs).map(function (n) {
          var on = String(s.sec[c]) === n;
          return {
            n: n, checked: on ? 'true' : 'false', aria: 'Section ' + n,
            pick: function () { var x = Object.assign({}, self.state.sec); x[c] = +n; self.setState({ sec: x }); },
            style: 'width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; font-family: \'JetBrains Mono\', monospace; font-size: 15px; font-weight: 700; ' + (on ? (clashWith ? 'background: #8F1D12; color: #F8F3EA;' : 'background: #0B1957; color: #F8F3EA;') : 'background: transparent; color: #0B1957; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.2);')
          };
        }),
        when: meets.map(function (m) { return DAY[m[0]] + ' ' + SLOT[m[1]]; }).join(', '),
        hasClash: !!clashWith,
        clashText: clashWith ? 'Clashes with ' + clashWith + ' on ' + at + '.' : '',
        cardStyle: 'border-radius: 20px; padding: 12px 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; ' + (dropped ? 'background: transparent; box-shadow: inset 0 0 0 2px rgba(11, 25, 87, 0.12); opacity: 0.6;' : 'background: #FFFDF8; box-shadow: 0 1px 0 rgba(11, 25, 87, 0.06), 0 8px 20px -14px rgba(11, 25, 87, 0.35)' + (clashWith ? ', 0 0 0 2px #E9A99F;' : ';'))
      };
    });
    var changes = 0;
    Object.keys(this.start).forEach(function (c) { if (s.dropped[c] || s.sec[c] !== self.start[c]) changes++; });
    s.added.forEach(function (c) { if (!s.dropped[c]) changes++; });
    var q = s.q.trim().toLowerCase();
    var avail = ['NLP', 'RL', 'AW', 'RS'].filter(function (c) { return s.added.indexOf(c) < 0; }).filter(function (c) {
      return !q || c.toLowerCase().indexOf(q) >= 0 || ALL[c].title.toLowerCase().indexOf(q) >= 0;
    });
    var available = avail.map(function (c, i) {
      return {
        title: ALL[c].title, meta: c + ' · ' + ALL[c].kind,
        aria: 'Add ' + ALL[c].title,
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0;' + (i ? ' border-top: 1.5px solid rgba(11, 25, 87, 0.1);' : ''),
        add: function () {
          var sec = Object.assign({}, self.state.sec); sec[c] = 1;
          self.setState({ added: self.state.added.concat([c]), sec: sec, sheet: false, q: '' });
        }
      };
    });
    var show = changes > 0 && !s.toast;
    var blocked = clashes > 0;
    return {
      rows: rows, available: available, noResults: available.length === 0,
      q: s.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      scrimStyle: 'position: absolute; inset: 0; background: rgba(11, 25, 87, 0.45); z-index: 3; ' + (s.sheet ? 'opacity: 1;' : 'opacity: 0; pointer-events: none;'),
      sheetStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: 600px; z-index: 4; background: #F8F3EA; border-radius: 32px 32px 0 0; padding: 12px 24px 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 40px -20px rgba(11, 25, 87, 0.5); transform: translateY(' + (s.sheet ? '0' : '100%') + ');',
      changeLabel: changes + (changes === 1 ? ' change' : ' changes'),
      barHint: blocked ? 'FIX THE CLASH TO SAVE' : 'NOT SAVED YET',
      barStyle: 'position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 2; background: #0B1957; color: #F8F3EA; border-radius: 28px; padding: 12px 12px 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 16px 32px -16px rgba(11, 25, 87, 0.7); transform: translateY(' + (show ? '0' : '160%') + ');',
      saveDisabled: blocked || s.saving ? 'true' : 'false',
      saveLabel: s.saving ? 'Saving…' : 'Save',
      saveStyle: 'height: 48px; padding: 0 24px; border-radius: 999px; border: none; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; ' + (blocked ? 'background: #1F2F74; color: #9AA3C7;' : 'background: #9ECCFA; color: #0B1957;'),
      save: function () {
        if (blocked || self.state.saving) return;
        self.setState({ saving: true });
        clearTimeout(self.t1); clearTimeout(self.t2);
        self.t1 = setTimeout(function () {
          var sec = Object.assign({}, self.state.sec);
          var start = {};
          Object.keys(self.start).concat(self.state.added).forEach(function (c) { if (!self.state.dropped[c]) start[c] = sec[c]; });
          self.start = start;
          self.setState({ saving: false, toast: true, dropped: {}, added: [], sec: sec });
          self.t2 = setTimeout(function () { self.setState({ toast: false }); }, 2400);
        }, 700);
      },
      toastStyle: 'position: absolute; left: 24px; right: 24px; bottom: 24px; z-index: 2; background: #D1E8FF; color: #0B1957; border-radius: 20px; padding: 16px 18px; font-size: 16px; font-weight: 800; box-shadow: 0 12px 24px -14px rgba(11, 25, 87, 0.5); ' + (s.toast ? 'transform: none; opacity: 1;' : 'transform: translateY(140%); opacity: 0;')
    };
  }
}
</script>
</body>
</html>
