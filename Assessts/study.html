/* ---------- rendering ---------- */
let store = {};
try { store = JSON.parse(localStorage.getItem('ds-l5-9-quiz')||'{}'); } catch(e) { store = {}; }
const saveStore = () => { try { localStorage.setItem('ds-l5-9-quiz', JSON.stringify(store)); } catch(e) {} };
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

function renderNav(cur){
  const items = [...LECS.map(l=>({id:l.id,num:l.num,title:l.title,total:l.quiz.length})),{id:'mixed',num:'All',title:'Mixed quiz',total:15}];
  document.getElementById('nav').innerHTML = items.map(l=>{ const b=store[l.id]; return `<a href="#${l.id}"${l.id===cur?' aria-current="page"':''}><span class="ln">${l.num}</span><span>${l.title}</span><span class="sc${b===l.total?' done':''}">${b!==undefined?b+'/'+l.total:''}</span></a>`; }).join('');
}

function renderQuiz(container, id, getQs, title, sub){
  const questions = getQs();
  const qs = questions.map(q=>{ const order = shuffle(q.o.map((t,i)=>i)); return {...q, order}; });
  const wrap = document.createElement('section'); wrap.className='quiz'; wrap.id='quiz';
  wrap.innerHTML = `<h2>${title}</h2><div class="qbar"><span>${sub}</span><span class="score" id="score">0 / ${qs.length} answered</span><button class="btn ghost" id="qreset">New attempt</button></div>` +
    qs.map((q,k)=>`<div class="q" data-k="${k}"><p class="qt"><span class="qn">${String(k+1).padStart(2,'0')}</span>${esc(q.q)}</p>${q.c?code(q.c):''}<div class="opts">${q.order.map((oi,pos)=>`<button class="opt" data-o="${oi}"><span class="k">${'abcd'[pos]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div><div class="exp" hidden></div></div>`).join('') +
    `<div class="final" id="final"></div>`;
  container.appendChild(wrap);
  let answered=0, right=0;
  wrap.addEventListener('click', e=>{
    if(e.target.closest('#qreset')){ wrap.remove(); renderQuiz(container,id,getQs,title,sub); document.getElementById('quiz').scrollIntoView({behavior:'smooth'}); return; }
    const b=e.target.closest('.opt'); if(!b||b.disabled) return;
    const qd=b.closest('.q'); const q=qs[+qd.dataset.k]; const pick=+b.dataset.o;
    qd.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; if(+o.dataset.o===q.a) o.classList.add('right'); });
    const ok = pick===q.a; if(!ok) b.classList.add('wrong');
    answered++; if(ok) right++;
    const ex=qd.querySelector('.exp'); ex.hidden=false; ex.innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b> ${esc(q.e)}`;
    wrap.querySelector('#score').textContent = `${right} correct · ${answered} / ${qs.length} answered`;
    if(answered===qs.length){
      const prev=store[id]; if(prev===undefined||right>prev){ store[id]=right; saveStore(); renderNav(id); }
      const f=wrap.querySelector('#final'); f.classList.add('show');
      f.innerHTML = `You got <b>${right} / ${qs.length}</b>. ${right===qs.length?'Every idea in this lecture is solid.':'Scroll up to the red answers, reread their explanation, and step through that lab again. Press “New attempt” to reshuffle the options.'}`;
    }
  });
}

function renderLecture(id){
  const main = document.getElementById('main');
  if(id==='mixed'){
    renderNav('mixed');
    main.innerHTML = `<header class="lec-head"><div class="eyebrow">ALL LECTURES</div><h1>Mixed quiz</h1><p>15 questions drawn at random from every lecture quiz. Press “New attempt” for a different set.</p></header>`;
    const pool = LECS.flatMap(l=>l.quiz.map(q=>({...q,q:`[${l.num}] `+q.q})));
    renderQuiz(main,'mixed',()=>shuffle(pool).slice(0,15),'Mixed quiz','Questions from L5 to L9 part 2');
    window.scrollTo(0,0); return;
  }
  const L = LECS.find(l=>l.id===id) || LECS[0];
  renderNav(L.id);
  main.innerHTML = `<header class="lec-head"><div class="eyebrow">LECTURE ${L.num}</div><h1>${L.title}</h1><p>${L.sub}</p><nav class="jump" aria-label="Steps">${L.steps.map((s,i)=>`<a href="#${L.id}" data-step="${i}">${i+1}. ${esc(s.t)}</a>`).join('')}<a href="#${L.id}" data-step="quiz">Quiz →</a></nav></header>` +
    L.steps.map((s,i)=>`<section class="step" id="s-${i}"><div class="n">${String(i+1).padStart(2,'0')}</div><div><h2>${esc(s.t)}</h2>${s.h||''}${s.w?`<div class="lab" data-w="${s.w}"></div>`:''}${s.h2||''}</div></section>`).join('');
  main.querySelectorAll('[data-w]').forEach(el=>{ try { W[el.dataset.w](el); } catch(err) { el.innerHTML = '<p class="err-msg">This lab could not load.</p>'; console.error(err); } });
  renderQuiz(main, L.id, ()=>L.quiz, `Quiz: ${L.title}`, `${L.quiz.length} questions, only on ideas from the slides`);
  main.querySelector('.jump').addEventListener('click', e=>{ const a=e.target.closest('[data-step]'); if(!a) return; e.preventDefault(); const t=a.dataset.step==='quiz'?document.getElementById('quiz'):document.getElementById('s-'+a.dataset.step); if(t) t.scrollIntoView({behavior:'smooth'}); });
  window.scrollTo(0,0);
}
function route(){ const h=location.hash.replace('#',''); renderLecture(h || 'vectors'); }
window.addEventListener('hashchange', route);
route();
